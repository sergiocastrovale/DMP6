services:
  redis:
    image: redis:7-alpine
    container_name: dmp-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - ${DMP_DATA}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    image: dmp-web:latest
    container_name: dmp-web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${DMP_PORT:-3000}:3000"
    volumes:
      - ${MUSIC_DIR}:/music:ro
      - ${DMP_DATA}/img:/app/data/img
      - ${DMP_DATA}/dump:/app/data/dump
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://dmp-redis:6379
      - MUSIC_DIR=/music
      - IMAGE_STORAGE=${IMAGE_STORAGE:-local}
      - IMAGE_DIR=/app/data/img
      - BACKUP_STORAGE=${BACKUP_STORAGE:-local}
      - S3_IMAGE_BUCKET=${S3_IMAGE_BUCKET:-}
      - S3_BACKUPS_BUCKET=${S3_BACKUPS_BUCKET:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      - NUXT_MUSIC_DIR=/music
      - NUXT_IMAGE_DIR=/app/data/img
      - NUXT_IMAGE_STORAGE=${IMAGE_STORAGE:-local}
      - NUXT_S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      - NUXT_MEDIASOUP_ANNOUNCED_IP=${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
      - NUXT_RTC_MIN_PORT=${RTC_MIN_PORT:-10000}
      - NUXT_RTC_MAX_PORT=${RTC_MAX_PORT:-10100}
      - NUXT_PARTY_SECRET=${PARTY_SECRET:-}
      - NUXT_PUBLIC_IMAGE_STORAGE=${IMAGE_STORAGE:-local}
      - NUXT_PUBLIC_S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
      - NUXT_PUBLIC_PARTY_ENABLED=${PARTY_ENABLED:-false}
      - NUXT_PUBLIC_PARTY_ROLE=${PARTY_ROLE:-listener}
      - NUXT_PUBLIC_PARTY_URL=${PARTY_URL:-}
      - PARTY_ENABLED=${PARTY_ENABLED:-false}
      - PARTY_ROLE=${PARTY_ROLE:-listener}
      - PARTY_URL=${PARTY_URL:-}
      - PARTY_SECRET=${PARTY_SECRET:-}
      - MEDIASOUP_ANNOUNCED_IP=${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
      - RTC_MIN_PORT=${RTC_MIN_PORT:-10000}
      - RTC_MAX_PORT=${RTC_MAX_PORT:-10100}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/stats').then(r=>{if(!r.ok)throw 1;process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
