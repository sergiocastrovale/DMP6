services:
  redis:
    image: redis:7-alpine
    container_name: dmp-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - ${DMP_DATA}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # NOTE: slskd is NOT defined here. dmp talks to the existing slskd (shared with Lidarr, running in
  # gluetun's netns) via SLSKD_URL (host :5030). Its download dir must be set to /downloads/dmp in that
  # slskd's own slskd.yml (it mounts /mnt/SSD/Downloads -> /downloads). Don't add a second slskd here —
  # it collides on port 5030.

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dmp-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy

  web:
    image: dmp:latest
    container_name: dmp
    hostname: dmp-web
    restart: unless-stopped
    # Join the shared downloads group (gid 568) so dmp can delete slskd-owned source files
    # during the post-download move — keeps DOWNLOADS_PATH fully self-cleaning (no orphan copies).
    group_add:
      - "568"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${DMP_PORT:-3000}:3000"
    volumes:
      - ${MUSIC_DIR}:/music
      - ${DMP_DATA}/img:/app/data/img
      - ${DMP_DATA}/dump:/app/data/dump
      - ${DMP_DATA}/logs:/app/data/logs
      # Identity mount: container path == host path, so DOWNLOADS_PATH is a real path everywhere
      # and the host-path SongKong scripts line up with the container's view.
      - ${DOWNLOADS_DIR:-/mnt/SSD/Downloads}:${DOWNLOADS_DIR:-/mnt/SSD/Downloads}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@dmp-redis:6379
      - MUSIC_DIR=/music
      # This is the primary instance: it alone runs the background monitor loop. A dev server pointed at
      # the same shared DB must NOT set this, or the two collide on the Rust scripts' exclusive DB lock.
      - MONITOR_PRIMARY=true
      - IMAGE_STORAGE=${IMAGE_STORAGE:-local}
      - IMAGE_DIR=/app/data/img
      - STORAGE_IMAGE_BUCKET=${STORAGE_IMAGE_BUCKET:-}
      - STORAGE_BACKUPS_BUCKET=${STORAGE_BACKUPS_BUCKET:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-}
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL:-}
      - NUXT_MUSIC_DIR=/music
      - NUXT_IMAGE_DIR=/app/data/img
      - NUXT_IMAGE_STORAGE=${IMAGE_STORAGE:-local}
      - NUXT_STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL:-}
      - NUXT_PUBLIC_IMAGE_STORAGE=${IMAGE_STORAGE:-local}
      - NUXT_PUBLIC_STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL:-}
      - DOWNLOADS_PATH=${DOWNLOADS_PATH:-/mnt/SSD/Downloads/dmp}
      # No compose default: an unescaped `}` in a `${VAR:-default}` value truncates compose's
      # interpolation at the first `}`, mangling the template. downloadSettings.ts's
      # DEFAULT_DOWNLOAD_DIR_TEMPLATE covers this when the env var is unset.
      - DOWNLOAD_DIR_TEMPLATE=${DOWNLOAD_DIR_TEMPLATE:-}
      - SLSKD_URL=${SLSKD_URL:-http://host.docker.internal:5030}
      - SLSKD_API_KEY=${SLSKD_API_KEY:-}
      - DOWNLOAD_FORMATS=${DOWNLOAD_FORMATS:-flac,mp3}
      - DOWNLOAD_MIN_BITRATE=${DOWNLOAD_MIN_BITRATE:-}
      - SONGKONG_ENABLED=${SONGKONG_ENABLED:-false}
      - SONGKONG_MAX_WAIT_MIN=${SONGKONG_MAX_WAIT_MIN:-30}
      - SONGKONG_STATE_DIR=${SONGKONG_STATE_DIR:-/mnt/SSD/Downloads/.dmp-songkong}
      - AUTO_MERGE=${AUTO_MERGE:-false}
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-5}
      - SEARCH_PICKS_PER_INTERVAL=${SEARCH_PICKS_PER_INTERVAL:-3}
      - SEARCH_INTERVAL_SEC=${SEARCH_INTERVAL_SEC:-60}
      - NO_PROGRESS_SEC=${NO_PROGRESS_SEC:-300}
      - GAPS_PICKS_PER_RUN=${GAPS_PICKS_PER_RUN:-20}
      - GAPS_INTERVAL_MIN=${GAPS_INTERVAL_MIN:-5}
      - DOWNLOADS_MIN_FREE_GB=${DOWNLOADS_MIN_FREE_GB:-5}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - LASTFM_SECRET=${LASTFM_SECRET:-}
      - LASTFM_SESSION_KEY=${LASTFM_SESSION_KEY:-}
      - LASTFM_USERNAME=${LASTFM_USERNAME:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)throw 1;process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
