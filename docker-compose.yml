services:
  redis:
    image: redis:7-alpine
    container_name: dmp-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - ${DMP_DATA}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  slskd:
    image: slskd/slskd:latest
    container_name: dmp-slskd
    restart: unless-stopped
    ports:
      - "5030:5030"
      - "50300:50300"
    volumes:
      - ${SLSKD_DATA:-/mnt/SSD/slskd}/config:/app
      - ${SLSKD_DATA:-/mnt/SSD/slskd}/data:/app/data
      - ${DOWNLOADS_DIR:-/mnt/SSD/Downloads}:/downloads

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dmp-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy

  web:
    image: dmp:latest
    container_name: dmp
    hostname: dmp-web
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${DMP_PORT:-3000}:3000"
    volumes:
      - ${MUSIC_DIR}:/music
      - ${DMP_DATA}/img:/app/data/img
      - ${DMP_DATA}/dump:/app/data/dump
      - ${DOWNLOADS_DIR:-/mnt/SSD/Downloads}:/downloads
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@dmp-redis:6379
      - MUSIC_DIR=/music
      - IMAGE_STORAGE=${IMAGE_STORAGE:-local}
      - IMAGE_DIR=/app/data/img
      - BACKUP_STORAGE=${BACKUP_STORAGE:-local}
      - STORAGE_IMAGE_BUCKET=${STORAGE_IMAGE_BUCKET:-}
      - STORAGE_BACKUPS_BUCKET=${STORAGE_BACKUPS_BUCKET:-}
      - AWS_REGION=${AWS_REGION:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-}
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL:-}
      - NUXT_MUSIC_DIR=/music
      - NUXT_IMAGE_DIR=/app/data/img
      - NUXT_IMAGE_STORAGE=${IMAGE_STORAGE:-local}
      - NUXT_STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL:-}
      - NUXT_PUBLIC_IMAGE_STORAGE=${IMAGE_STORAGE:-local}
      - NUXT_PUBLIC_STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL:-}
      - DOWNLOADS_PATH=/downloads
      - DOWNLOAD_DIR_TEMPLATE=${DOWNLOAD_DIR_TEMPLATE:-{artist}/{year} - {album}}
      - SLSKD_URL=${SLSKD_URL:-http://dmp-slskd:5030}
      - SLSKD_API_KEY=${SLSKD_API_KEY:-}
      - DEEZER_ARL=${DEEZER_ARL:-}
      - DOWNLOAD_FORMATS=${DOWNLOAD_FORMATS:-flac,mp3}
      - DOWNLOAD_MIN_BITRATE=${DOWNLOAD_MIN_BITRATE:-}
      - SONGKONG_ENABLED=${SONGKONG_ENABLED:-false}
      - SONGKONG_MAX_WAIT_MIN=${SONGKONG_MAX_WAIT_MIN:-30}
      - DOWNLOADS_APPROVED_FOLDER=${DOWNLOADS_APPROVED_FOLDER:-/downloads/_approved}
      - AUTO_APPROVE_DOWNLOADS=${AUTO_APPROVE_DOWNLOADS:-true}
      - AUTO_MERGE=${AUTO_MERGE:-false}
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-5}
      - SEARCH_PICKS_PER_INTERVAL=${SEARCH_PICKS_PER_INTERVAL:-3}
      - SEARCH_INTERVAL_SEC=${SEARCH_INTERVAL_SEC:-60}
      - NO_PROGRESS_SEC=${NO_PROGRESS_SEC:-300}
      - GAPS_PICKS_PER_RUN=${GAPS_PICKS_PER_RUN:-20}
      - GAPS_INTERVAL_MIN=${GAPS_INTERVAL_MIN:-5}
      - DOWNLOADS_MIN_FREE_GB=${DOWNLOADS_MIN_FREE_GB:-5}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - LASTFM_SECRET=${LASTFM_SECRET:-}
      - LASTFM_SESSION_KEY=${LASTFM_SESSION_KEY:-}
      - LASTFM_USERNAME=${LASTFM_USERNAME:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)throw 1;process.exit(0)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
