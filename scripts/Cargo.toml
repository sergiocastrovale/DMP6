[workspace]
members = [
    "common",
    "index",
    "sync",
    "fix",
    "analysis",
    "audit",
    "nuke",
    "playlists",
    "delete",
    "mosaic",
    "dissect",
    "problems",
]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# CLI
clap = { version = "4.5", features = ["derive"] }
# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json"] }
# Parallel directory traversal (NAS-optimized)
jwalk = "0.8"
# Parallel CPU work
rayon = "1.10"
# Audio tag reading
lofty = "0.24"
# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Image processing
image = "0.25"
# AWS S3
aws-sdk-s3 = "1"
aws-config = "1"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# Utilities
regex = "1"
slug = "0.1"
cuid2 = "0.1"
md-5 = "0.10"
colored = "2.1"
dotenvy = "0.15"
urlencoding = "2.1"
futures = "0.3"
num_cpus = "1.16"
rand = "0.8"
html-escape = "0.2"
unicode-normalization = "0.1"
# constant_memory streams rows to a tempfile instead of holding the sheet in RAM - `problems` can
# emit millions of rows inside a 2 GB container.
rust_xlsxwriter = { version = "0.80", features = ["constant_memory"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# `problems` scans the whole library in one multi-hour pass. A lofty panic on a single corrupt file
# must cost one row in the report, not the entire run - which needs catch_unwind, which needs
# unwinding. Every other binary keeps panic = "abort" from [profile.release].
#
#   cargo build --profile scan -p problems   ->   target/scan/problems
#
# This cannot be a [profile.release.package.problems] override: that table deliberately excludes
# `panic`, because the panic strategy has to be uniform across a linked binary.
[profile.scan]
inherits = "release"
panic = "unwind"
# Fat LTO with one codegen unit costs minutes of link time and buys nothing on an I/O-bound scanner.
lto = "thin"
codegen-units = 16
