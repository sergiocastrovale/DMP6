[workspace]
members = [
    "common",
    "index",
    "sync",
    "fix",
    "analysis",
    "audit",
    "nuke",
    "playlists",
]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# CLI
clap = { version = "4.5", features = ["derive"] }
# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json"] }
# Parallel directory traversal (NAS-optimized)
jwalk = "0.8"
# Parallel CPU work
rayon = "1.10"
# Audio tag reading
lofty = "0.22"
# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Image processing
image = "0.25"
# AWS S3
aws-sdk-s3 = "1"
aws-config = "1"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# Utilities
regex = "1"
slug = "0.1"
cuid2 = "0.1"
md-5 = "0.10"
colored = "2.1"
dotenvy = "0.15"
urlencoding = "2.1"
futures = "0.3"
num_cpus = "1.16"
rand = "0.8"
html-escape = "0.2"
rust_xlsxwriter = "0.80"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
